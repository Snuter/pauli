[project]
name = "pauli"
version = "0.1.0"
description = "Patient-centered AI for Understanding Literature and Insights"
authors = [
    {name = "Snuter"}
]
license = "MIT License"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.115,<1.0.0)",
    "uvicorn (>=0.30,<1.0.0)",
    "httpx (>=0.27,<1.0.0)",
    "sqlite-vec (>=0.1.0,<1.0.0)",
    "ollama (>=0.4.0,<1.0.0)",
    "jinja2 (>=3.1,<4.0.0)",
    "textstat (>=0.7,<1.0.0)",
    "apscheduler (>=3.10,<4.0.0)",
]

[dependency-groups]
dev = [
    "playwright (>=1.55.0,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-playwright (>=0.10.0,<0.11.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
